server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /generated-packs/ {
        proxy_pass http://127.0.0.1:8000/generated-packs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Machine discovery: never SPA-fallback these to index.html
    location ^~ /.well-known/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=60" always;
        error_page 404 =404;
        try_files $uri $uri.json =404;
    }

    location = /.well-known/mcp {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/nginx/html/.well-known/mcp.json;
    }

    location = /a2a {
        if ($request_method = POST) {
            return 307 https://x402-mcp.onrender.com/a2a;
        }
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/nginx/html/.well-known/agent-card.json;
    }

    location = /mcp {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/nginx/html/.well-known/mcp.json;
    }

    location = /mcp/mcp {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/nginx/html/.well-known/mcp.json;
    }

    location = /cities {
        return 307 https://x402-mcp.onrender.com/us/cities;
    }

    location = /us/cities {
        return 307 https://x402-mcp.onrender.com/us/cities;
    }

    location = /openapi.json {
        return 307 https://x402-mcp.onrender.com/openapi.json;
    }

    location /docs/ {
        try_files $uri $uri.html $uri/ /docs/index.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    error_page 404 /index.html;
}
