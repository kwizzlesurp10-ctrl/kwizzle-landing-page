<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" fill="none" role="img" aria-labelledby="heroFlowTitle">
  <title id="heroFlowTitle">Agent requests a paid x402 resource and settles on Base</title>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="24" y="24" width="432" height="372" rx="20" stroke="url(#g1)" stroke-width="1.5" opacity="0.35"/>
  <rect x="48" y="56" width="140" height="72" rx="12" fill="#12121a" stroke="#3f3f46"/>
  <text x="68" y="88" fill="#e4e4e7" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Agent</text>
  <text x="68" y="108" fill="#a1a1aa" font-family="ui-monospace,monospace" font-size="11">MCP / A2A</text>
  <rect x="292" y="56" width="140" height="72" rx="12" fill="#12121a" stroke="#3f3f46"/>
  <text x="312" y="88" fill="#e4e4e7" font-family="system-ui,sans-serif" font-size="14" font-weight="600">x402 API</text>
  <text x="312" y="108" fill="#a1a1aa" font-family="ui-monospace,monospace" font-size="11">402 + pay</text>
  <path d="M188 92 H292" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b5cf6"/></marker></defs>
  <rect x="120" y="168" width="240" height="88" rx="14" fill="#0a0a0f" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/>
  <text x="148" y="202" fill="#34d399" font-family="ui-monospace,monospace" font-size="22" font-weight="700">402</text>
  <text x="188" y="202" fill="#e4e4e7" font-family="system-ui,sans-serif" font-size="15">Payment Required</text>
  <text x="148" y="232" fill="#a1a1aa" font-family="ui-monospace,monospace" font-size="12">USDC · Base · eip155:8453</text>
  <rect x="148" y="292" width="184" height="72" rx="12" fill="#12121a" stroke="#38bdf8" opacity="0.9"/>
  <text x="168" y="322" fill="#bae6fd" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Settled resource</text>
  <text x="168" y="342" fill="#a1a1aa" font-family="ui-monospace,monospace" font-size="11">MCP tools · OpenAPI</text>
  <path d="M240 256 V292" stroke="#38bdf8" stroke-width="2"/>
</svg>
