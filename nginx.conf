server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Machine discovery: never SPA-fallback these to index.html
    location ^~ /.well-known/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=60" always;
        error_page 404 =404;
        try_files $uri $uri.json =404;
    }

    location = /.well-known/mcp {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/nginx/html/.well-known/mcp.json;
    }

    location = /a2a {
        if ($request_method = POST) {
            return 307 https://x402-mcp.onrender.com/a2a;
        }
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/nginx/html/.well-known/agent-card.json;
    }

    location = /mcp {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/nginx/html/.well-known/mcp.json;
    }

    location = /mcp/mcp {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/nginx/html/.well-known/mcp.json;
    }

    location = /cities {
        return 307 https://x402-mcp.onrender.com/us/cities;
    }

    location = /us/cities {
        return 307 https://x402-mcp.onrender.com/us/cities;
    }

    location = /openapi.json {
        return 307 https://x402-mcp.onrender.com/openapi.json;
    }

    location /docs/ {
        try_files $uri $uri.html $uri/ /docs/index.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy\n';
    }

    error_page 404 /index.html;
}
