# Proxy machine-discovery and paid API paths to the live x402 gateway.
# Local static assets (llms.txt, agent-card.json, mcp.json, /docs/, etc.) stay on this host.

location = /.well-known/x402 {
    proxy_pass https://x402-mcp.onrender.com/.well-known/x402;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}

location = /.well-known/funding.json {
    proxy_pass https://x402-mcp.onrender.com/.well-known/funding.json;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}

location = /.well-known/agents.json {
    proxy_pass https://x402-mcp.onrender.com/.well-known/agents.json;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}

location = /.well-known/agentic-market.json {
    proxy_pass https://x402-mcp.onrender.com/.well-known/agentic-market.json;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}

location = /openapi.json {
    proxy_pass https://x402-mcp.onrender.com/openapi.json;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}

location = /.well-known/mcp {
    proxy_pass https://x402-mcp.onrender.com/.well-known/mcp;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}

location ^~ /.well-known/mcp/ {
    proxy_pass https://x402-mcp.onrender.com;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}

location ^~ /mcp/ {
    proxy_pass https://x402-mcp.onrender.com;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}

location ^~ /us/ {
    proxy_pass https://x402-mcp.onrender.com;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}

location ^~ /mn/ {
    proxy_pass https://x402-mcp.onrender.com;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}

location ^~ /base/ {
    proxy_pass https://x402-mcp.onrender.com;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}

location ^~ /agent/ {
    proxy_pass https://x402-mcp.onrender.com;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}

location ^~ /tasks/ {
    proxy_pass https://x402-mcp.onrender.com;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}

location ^~ /swarm/ {
    proxy_pass https://x402-mcp.onrender.com;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}

location = /pulse {
    proxy_pass https://x402-mcp.onrender.com/pulse;
    include /etc/nginx/snippets/x402-proxy-params.conf;
}
